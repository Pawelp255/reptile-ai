<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>Reptilita app icon</title>
  <defs>
    <!-- Premium dark gradient — fully opaque (App Store forbids alpha) -->
    <linearGradient id="bgSurf" x1="88" y1="72" x2="936" y2="972" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#141c19"/>
      <stop offset="0.52" stop-color="#080b0a"/>
      <stop offset="1" stop-color="#040605"/>
    </linearGradient>
    <radialGradient id="rimLight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 248) rotate(92) scale(588 792)">
      <stop offset="0" stop-color="#182f2b"/>
      <stop offset="0.38" stop-color="#0f1d19"/>
      <stop offset="0.7" stop-color="#0a1411"/>
      <stop offset="1" stop-color="#040605"/>
    </radialGradient>
    <radialGradient id="irisFill" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 478) rotate(90) scale(330 284)">
      <stop offset="0" stop-color="#5ff0dc"/>
      <stop offset="0.28" stop-color="#34c9b6"/>
      <stop offset="0.55" stop-color="#1a9587"/>
      <stop offset="0.82" stop-color="#0d4a43"/>
      <stop offset="1" stop-color="#06221e"/>
    </radialGradient>
    <!-- Rim highlight baked as opaque emerald ring -->
    <radialGradient id="irisRim" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(512 478) rotate(89) scale(374 296)">
      <stop offset="0.62" stop-color="#1a9587"/>
      <stop offset="0.78" stop-color="#218f81"/>
      <stop offset="0.92" stop-color="#2faa98"/>
      <stop offset="1" stop-color="#0f4a43"/>
    </radialGradient>
    <linearGradient id="lidSheen" x1="312" y1="296" x2="712" y2="596" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d5ece6"/>
      <stop offset="0.35" stop-color="#7bbfb0"/>
      <stop offset="0.72" stop-color="#2e8f82"/>
      <stop offset="1" stop-color="#1a9587"/>
    </linearGradient>
    <linearGradient id="slitGlass" x1="512" y1="348" x2="512" y2="608" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a1514"/>
      <stop offset="0.5" stop-color="#030303"/>
      <stop offset="1" stop-color="#121616"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed base: no transparent pixels in corners (iOS icon is a square asset) -->
  <rect width="1024" height="1024" fill="#040605"/>
  <rect width="1024" height="1024" rx="226" ry="226" fill="url(#bgSurf)"/>
  <rect width="1024" height="1024" rx="226" ry="226" fill="url(#rimLight)"/>
  <!-- Outer eye socket depth — opaque -->
  <ellipse cx="512" cy="490" rx="368" ry="316" fill="#0a1310"/>
  <ellipse cx="512" cy="488" rx="352" ry="302" fill="#0d1613"/>
  <!-- Iris -->
  <ellipse cx="512" cy="478" rx="336" ry="258" fill="url(#irisFill)"/>
  <ellipse cx="512" cy="478" rx="342" ry="264" fill="url(#irisRim)"/>
  <ellipse cx="512" cy="478" rx="336" ry="258" fill="none" stroke="#328f81" stroke-width="5"/>
  <!-- Glass sheen — opaque soft highlight -->
  <ellipse cx="468" cy="408" rx="160" ry="96" transform="rotate(-18 468 408)" fill="url(#lidSheen)"/>
  <ellipse cx="420" cy="384" rx="42" ry="28" transform="rotate(-22 420 384)" fill="#d3ece6"/>
  <!-- Vertical slit pupil -->
  <ellipse cx="512" cy="478" rx="44" ry="208" fill="url(#slitGlass)"/>
  <ellipse cx="512" cy="478" rx="26" ry="196" fill="#000000"/>
  <ellipse cx="512" cy="478" rx="30" ry="188" fill="none" stroke="#2b7d72" stroke-width="4"/>
</svg>
