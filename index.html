<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <style>
      /* Match the app canvas before CSS loads so iOS overscroll never exposes black in light mode. */
      html,
      body,
      #root {
        background-color: #f7faf9;
        min-height: 100%;
      }

      @media (prefers-color-scheme: dark) {
        html,
        body,
        #root {
          background-color: #040605;
        }
      }
    </style>
    
    <!-- App Identity -->
    <title>Reptilita — Reptile and amphibian care</title>
    <meta name="description" content="Local-first feeding, cleaning, and health journals for reptiles and amphibians, with care schedules and Apple Watch Feed, Clean, and Mist. Download on the App Store." />
    <meta name="author" content="Reptilita" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#2a9d8f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Reptilita" />
    <meta name="application-name" content="Reptilita" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://reptilita.com/" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="Reptilita — Reptile and amphibian care" />
    <meta property="og:description" content="Local-first feeding, cleaning, and health journals for your herp collection, with schedules and Apple Watch Feed, Clean, and Mist." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://reptilita.com/" />
    <meta property="og:image" content="https://reptilita.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Reptilita" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Reptilita — Reptile and amphibian care" />
    <meta name="twitter:description" content="Local-first feeding, cleaning, and health journals for your herp collection, with schedules and Apple Watch Feed, Clean, and Mist." />
    <meta name="twitter:image" content="https://reptilita.com/og-image.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
